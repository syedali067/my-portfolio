/* =====================================================================
   Muhammad Ali Shah — Portfolio Stylesheet
   Plain CSS, no framework. Design tokens defined as custom properties.
===================================================================== */

:root{
  --bg:#FFFFFF;
  --surface:#F6F8FE;
  --card:#FFFFFF;
  --ink:#0B1220;
  --ink-dim:#5B6478;
  --border:#E4E9F5;
  --blue-600:#2451C4;
  --blue-700:#1B3D9E;
  --blue-100:#EAF0FD;
  --blue-300:#9BB4EE;
  --violet-600:#7C5CFC;
  --violet-100:#F1EDFE;
  --amber-600:#B8790C;
  --amber-100:#FDF3E0;
  --teal-600:#0D9488;
  --teal-100:#E4FBF7;
  --sage-600:#5B7350;
  --sage-100:#EEF2E6;
  --success:#1FA971;
  --danger:#C0392B;
  --shadow:0 1px 2px rgba(16,24,54,.04), 0 6px 18px rgba(16,24,54,.05);
  --shadow-hover:0 4px 10px rgba(16,24,54,.06), 0 14px 30px rgba(16,24,54,.09);

  --font-display:'Manrope',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;

  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--s6:48px;--s7:64px;--s8:96px;--s9:112px;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-std:cubic-bezier(.4,0,.2,1);
  --maxw:1180px;
  --r:12px;
}

html[data-theme="dark"]{
  --bg:#0A0F1F;
  --surface:#0F1730;
  --card:#121B37;
  --ink:#EEF2FB;
  --ink-dim:#8C97B4;
  --border:#212C4D;
  --blue-600:#6088F0;
  --blue-700:#84A4F5;
  --blue-100:#16224A;
  --blue-300:#3E5AAE;
  --success:#3FCB93;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.3);
  --shadow-hover:0 4px 10px rgba(0,0,0,.35), 0 14px 32px rgba(0,0,0,.4);
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;transition:background .3s var(--ease-std),color .3s var(--ease-std);
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
img{max-width:100%;display:block;}
ul{margin:0;padding:0;}
.mono{font-family:var(--font-mono);}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--s5);}
@media(max-width:768px){.wrap{padding:0 var(--s4);}}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-600);font-weight:500;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--blue-600);color:#fff;padding:10px 18px;z-index:1000;border-radius:0 0 8px 0;}
.skip-link:focus{left:0;top:0;}
:focus-visible{outline:2px solid var(--blue-600);outline-offset:3px;border-radius:4px;}

/* ============================= PROGRESS BAR ============================= */
#progress{position:fixed;top:0;left:0;height:3px;background:var(--blue-600);width:0%;z-index:250;transition:width .1s linear;}

/* ============================= NAV ============================= */
#nav{position:fixed;top:0;left:0;right:0;z-index:200;height:70px;display:flex;align-items:center;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s;}
#nav.scrolled{border-bottom-color:var(--border);}
#nav .wrap{display:flex;align-items:center;justify-content:space-between;width:100%;}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:16px;font-weight:800;}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--blue-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.nav-links{display:flex;gap:var(--s5);list-style:none;margin:0;padding:0;}
.nav-links a{font-size:14px;font-weight:500;color:var(--ink-dim);transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--blue-600);}
.nav-right{display:flex;align-items:center;gap:var(--s3);}
.badge{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-dim);background:var(--blue-100);padding:6px 12px;border-radius:20px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--success);}
.theme-toggle,.hamburger{width:36px;height:36px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--card);}
.theme-toggle:hover,.hamburger:hover{border-color:var(--blue-300);}
.hamburger{display:none;}
@media(max-width:880px){.nav-links{display:none;}.hamburger{display:flex;}}

#mobile-menu{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:var(--s4);padding:var(--s5);transform:translateY(-100%);transition:transform .35s var(--ease-out);}
#mobile-menu.open{transform:translateY(0);}
#mobile-menu a{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--ink);}
#mobile-menu .close-btn{position:absolute;top:20px;right:20px;width:40px;height:40px;border:1px solid var(--border);border-radius:9px;}

/* ============================= SECTIONS ============================= */
section{position:relative;padding:var(--s9) 0;}
@media(max-width:768px){section{padding:var(--s7) 0;}}
.section-head{margin-bottom:var(--s6);max-width:640px;}
h2.section-title{font-size:clamp(26px,4vw,40px);line-height:1.15;margin-top:8px;}
.section-desc{margin-top:10px;color:var(--ink-dim);font-size:15.5px;line-height:1.6;}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease-out),transform .5s var(--ease-out);}
.reveal.in{opacity:1;transform:translateY(0);}
.divider{height:1px;background:var(--border);}
.alt-bg{background:var(--surface);}

/* ============================= HERO ============================= */
#hero{min-height:96dvh;display:flex;align-items:center;padding-top:var(--s7);position:relative;overflow:hidden;}
.hero-blob{position:absolute;top:-15%;right:-8%;width:520px;height:520px;background:radial-gradient(circle, color-mix(in srgb, var(--blue-600) 10%, transparent) 0%, transparent 72%);border-radius:50%;pointer-events:none;}
.hero-split{display:grid;grid-template-columns:1fr;gap:var(--s7);align-items:center;position:relative;z-index:2;}
@media(min-width:1024px){.hero-split{grid-template-columns:1.15fr .95fr;}}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--blue-100);color:var(--blue-600);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;}
h1.hero-title{font-size:clamp(34px,5.2vw,58px);line-height:1.12;margin-top:var(--s4);}
.hero-title .accent{color:var(--blue-600);}
.hero-sub{margin-top:var(--s4);max-width:52ch;color:var(--ink-dim);font-size:17px;line-height:1.65;}
.hero-ctas{margin-top:var(--s5);display:flex;gap:var(--s3);flex-wrap:wrap;}
.hero-meta{margin-top:var(--s6);display:flex;gap:var(--s6);flex-wrap:wrap;}
.hero-meta div{display:flex;flex-direction:column;gap:2px;}
.hero-meta strong{font-family:var(--font-display);font-size:20px;}
.hero-meta span{font-size:12.5px;color:var(--ink-dim);}

.btn{font-size:14px;font-weight:600;padding:13px 22px;border-radius:10px;border:1px solid var(--border);transition:all .2s var(--ease-std);display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--blue-600);border-color:var(--blue-600);color:#fff;}
.btn-primary:hover{background:var(--blue-700);border-color:var(--blue-700);}
.btn-ghost{background:var(--card);color:var(--ink);}
.btn-ghost:hover{border-color:var(--blue-300);color:var(--blue-600);}
.btn-sm{padding:9px 15px;font-size:13px;border-radius:8px;}
.btn[disabled]{opacity:.5;pointer-events:none;}

/* hero code panel (kept — it's real, verified CV content, not decoration) */
.hero-visual{position:relative;display:none;}
@media(min-width:1024px){.hero-visual{display:block;}}
.code-window{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-hover);overflow:hidden;}
.code-window-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
.code-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.d1{background:#EF6A5F;}.d2{background:#F5BD4F;}.d3{background:#61C454;}
.code-tab{margin-left:6px;font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);}
.code-body{padding:20px 22px;font-family:var(--font-mono);font-size:12.5px;line-height:1.85;overflow-x:auto;}
.code-line{white-space:pre;}
.ln{display:inline-block;width:18px;color:var(--ink-dim);opacity:.5;user-select:none;}
.tok-com{color:var(--ink-dim);font-style:italic;}
.tok-kw{color:var(--violet-600);}
.tok-str{color:var(--teal-600);}
.tok-fn{color:var(--blue-600);}
.tok-prop{color:var(--amber-600);}
.code-cursor{display:inline-block;width:6px;height:13px;background:var(--blue-600);vertical-align:-2px;}

/* ============================= ABOUT ============================= */
.about-grid{display:grid;grid-template-columns:1fr;gap:var(--s6);}
@media(min-width:900px){.about-grid{grid-template-columns:1.3fr 1fr;}}
.about-text p{font-size:16px;line-height:1.75;color:var(--ink);}
.about-text p + p{margin-top:var(--s4);}
.about-facts{display:flex;flex-direction:column;gap:var(--s3);}
.fact-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:var(--s4);}
.fact-card .fact-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-600);}
.fact-card .fact-value{margin-top:6px;font-size:15px;font-weight:600;}
.fact-card .fact-sub{margin-top:2px;font-size:13px;color:var(--ink-dim);}

/* ============================= SKILLS ============================= */
.stack-grid{display:grid;grid-template-columns:1fr;gap:var(--s4);}
@media(min-width:800px){.stack-grid{grid-template-columns:repeat(2,1fr);}}
.learning-note{margin-top:var(--s5);padding:var(--s4) var(--s5);border:1px dashed var(--sage-600);border-radius:var(--r);background:var(--sage-100);}
.stack-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:var(--s5);box-shadow:var(--shadow);}
.stack-card-head{display:flex;align-items:center;gap:10px;margin-bottom:var(--s4);}
.stack-icon{width:34px;height:34px;border-radius:9px;background:var(--accent-tint,var(--blue-100));color:var(--accent,var(--blue-600));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stack-card.c-frontend{--accent:var(--blue-600);--accent-tint:var(--blue-100);}
.stack-card.c-backend{--accent:var(--violet-600);--accent-tint:var(--violet-100);}
.stack-card.c-database{--accent:var(--amber-600);--accent-tint:var(--amber-100);}
.stack-card.c-tools{--accent:var(--teal-600);--accent-tint:var(--teal-100);}
.stack-card-title{font-family:var(--font-display);font-weight:700;font-size:16px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{font-size:13px;font-weight:500;padding:8px 13px;border:1px solid var(--border);border-radius:9px;background:var(--surface);transition:all .18s var(--ease-std);}
.chip:hover{border-color:var(--accent,var(--blue-300));background:var(--accent-tint,var(--blue-100));color:var(--accent,var(--blue-600));}

/* ============================= EXPERIENCE ============================= */
.role-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:var(--s6);box-shadow:var(--shadow);}
.role-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s3);align-items:flex-start;}
.role-title{font-size:21px;}
.role-company{color:var(--blue-600);font-weight:600;font-size:14.5px;margin-top:4px;}
.role-dates{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);background:var(--surface);padding:6px 12px;border-radius:8px;white-space:nowrap;}
.impact-list{list-style:none;margin:var(--s5) 0 0;padding:0;display:grid;grid-template-columns:1fr;gap:var(--s3);}
@media(min-width:800px){.impact-list{grid-template-columns:1fr 1fr;}}
.impact-list li{display:flex;gap:10px;font-size:14.5px;line-height:1.55;}
.impact-list li svg{flex-shrink:0;margin-top:3px;color:var(--blue-600);}
.role-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s5);}
.role-tags span{font-family:var(--font-mono);font-size:11px;color:var(--blue-600);background:var(--blue-100);padding:4px 9px;border-radius:6px;}

/* ============================= EDUCATION ============================= */
.edu-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:var(--s6);box-shadow:var(--shadow);}
.edu-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s3);align-items:flex-start;}
.edu-degree{font-size:20px;}
.edu-school{color:var(--blue-600);font-weight:600;font-size:14.5px;margin-top:4px;}
.edu-dates{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);background:var(--surface);padding:6px 12px;border-radius:8px;white-space:nowrap;}
.edu-courses{margin-top:var(--s5);}
.edu-courses .fact-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px;display:block;}
.edu-fyp{margin-top:var(--s4);padding:var(--s4);background:var(--surface);border-radius:9px;font-size:14.5px;line-height:1.6;}
.edu-fyp strong{color:var(--blue-600);}

/* ============================= CERTIFICATIONS ============================= */
.cert-grid{display:grid;grid-template-columns:1fr;gap:var(--s3);}
@media(min-width:640px){.cert-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1000px){.cert-grid{grid-template-columns:repeat(3,1fr);}}
.cert-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:14px;font-weight:600;box-shadow:var(--shadow);text-align:left;width:100%;font-family:inherit;color:var(--ink);transition:box-shadow .2s,transform .2s,border-color .2s;}
.cert-card.has-img{cursor:pointer;padding:10px;}
.cert-card.has-img:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--blue-300);}
.cert-thumb{width:52px;height:52px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--surface);border:1px solid var(--border);}
.cert-thumb img{width:100%;height:100%;object-fit:cover;}
.cert-name{line-height:1.3;}
.cert-icon{width:30px;height:30px;border-radius:8px;background:var(--blue-100);color:var(--blue-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cert-note{margin-top:var(--s4);font-size:13.5px;color:var(--ink-dim);}

/* ============================= CERTIFICATE LIGHTBOX ============================= */
#cert-lightbox{position:fixed;inset:0;z-index:650;display:none;align-items:center;justify-content:center;padding:28px;}
#cert-lightbox.open{display:flex;}
#cert-lightbox-overlay{position:absolute;inset:0;background:rgba(11,18,32,.72);backdrop-filter:blur(3px);}
#cert-lightbox-panel{position:relative;max-width:600px;width:100%;}
#cert-lightbox-panel img{width:100%;border-radius:12px;box-shadow:var(--shadow-hover);background:var(--card);}
#cert-lightbox-close{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink);}
#cert-lightbox-close:hover{border-color:var(--blue-300);}

/* ============================= PROJECTS ============================= */
.projects-grid{display:grid;grid-template-columns:1fr;gap:var(--s5);}
@media(min-width:800px){.projects-grid{grid-template-columns:1fr 1fr;}}
.project-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;display:flex;flex-direction:column;}
.project-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);}
.project-media{aspect-ratio:16/10;overflow:hidden;background:var(--surface);position:relative;cursor:pointer;border:0;width:100%;padding:0;display:block;}
.project-media img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .3s var(--ease-std);}
.project-card:hover .project-media img{transform:scale(1.03);}
.project-media.placeholder{display:flex;align-items:center;justify-content:center;cursor:default;}
.project-media .soon-badge{position:absolute;top:10px;right:10px;background:var(--ink);color:var(--bg);font-family:var(--font-mono);font-size:10.5px;padding:5px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;}
.project-body{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);flex:1;}
.project-tags{display:flex;flex-wrap:wrap;gap:6px;}
.project-tags span{font-family:var(--font-mono);font-size:11px;color:var(--blue-600);background:var(--blue-100);padding:4px 9px;border-radius:6px;}
.project-title{font-size:19px;}
.project-desc{font-size:14px;line-height:1.6;color:var(--ink-dim);}
.project-features{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
.project-features li{font-size:13.5px;display:flex;gap:8px;color:var(--ink);}
.project-features li::before{content:'';flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--blue-600);margin-top:8px;}
.project-links{display:flex;gap:var(--s3);margin-top:auto;padding-top:var(--s2);flex-wrap:wrap;}
.project-links a,.project-links button{font-size:13px;font-weight:600;color:var(--blue-600);display:inline-flex;align-items:center;gap:4px;}
.project-links a:hover,.project-links button:hover{color:var(--blue-700);}
.project-links .disabled-link{color:var(--ink-dim);cursor:default;}

/* ============================= PROJECT MODAL ============================= */
#project-modal{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;padding:24px;}
#project-modal.open{display:flex;}
#modal-overlay{position:absol
